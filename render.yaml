services:
  - type: web
    name: dashboard-cdr-dhdn
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DB_PATH
        value: /var/data/cdr_dashboard.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: cdr-data
      mountPath: /var/data
      sizeGB: 1
